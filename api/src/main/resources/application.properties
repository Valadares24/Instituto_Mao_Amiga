spring.application.name=maoamiga
server.port=8080

# H2 Database gravando em arquivo
spring.datasource.url=jdbc:h2:file:./data/maoamigadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI disponivel em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Exibir mensagem de erro nas respostas (ex: 400 e 404)
server.error.include-message=always

